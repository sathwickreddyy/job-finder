name: jobops
services:
  app:
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://jobops:jobops_local_only@postgres:5432/jobops
      APP_URL: ${APP_URL:-http://127.0.0.1:3210}
      STORAGE_ROOT: /app/data/uploads
    ports:
      - "3210:3210"
    volumes:
      - ${STORAGE_ROOT:-./data/uploads}:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/v1/companies/schema').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobops
      POSTGRES_USER: jobops
      POSTGRES_PASSWORD: jobops_local_only
    ports:
      - "127.0.0.1:5549:5432"
    volumes:
      - jobops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobops -d jobops"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  jobops_postgres:
