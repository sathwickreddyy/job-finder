<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 648" role="img" aria-labelledby="title description">
  <title id="title">JobOps system map and job-to-interview flow</title>
  <desc id="description">A browser or authorized agent uses JobOps. The user submits to the employer. JobOps reads Gmail or Outlook on demand and calls the scoring service. It stores records in PostgreSQL and résumé files in private storage. The highlighted flow goes from finding and saving an opening to checking the résumé, submitting and recording it, matching recruiting mail, and tracking interviews.</desc>

  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1F59AB"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F59AB" stroke-width="1.7"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="1" y="1" width="1118" height="646" rx="22" fill="#F5F8FC" stroke="#CAD6E5" stroke-width="1.5"/>
    <text x="32" y="35" fill="#1F59AB" font-size="15" font-weight="750" text-anchor="start" letter-spacing="2">SYSTEM MAP / JOBOPS</text>
    <text x="32" y="70" fill="#142842" font-size="31" font-weight="750" text-anchor="start" letter-spacing="0">How JobOps connects the search to the interview</text>
    <text x="32" y="99" fill="#475B73" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0">The portal and local API track the same application from the first saved job to its next round.</text>
    <rect x="23" y="119" width="1074" height="321" rx="15" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.5"/>
    <path d="M287 178 H420" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <path d="M149 209 V256" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <path d="M420 213 H336 V366 H287" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#open)"/>
    <path d="M557 233 V322" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <path d="M693 178 H835" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <path d="M693 210 H757 V295 H835" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <text x="352" y="160" fill="#143B78" font-size="16" font-weight="650" text-anchor="middle" letter-spacing="0">UI / REST</text>
    <text x="162" y="239" fill="#143B78" font-size="16" font-weight="650" text-anchor="start" letter-spacing="0">User submits</text>
    <text x="348" y="310" fill="#143B78" font-size="16" font-weight="650" text-anchor="start" letter-spacing="0">Read mail on demand</text>
    <text x="545" y="279" fill="#143B78" font-size="16" font-weight="650" text-anchor="end" letter-spacing="0">PDF + job text over HTTP</text>
    <text x="766" y="160" fill="#143B78" font-size="16" font-weight="650" text-anchor="middle" letter-spacing="0">Records</text>
    <text x="768" y="267" fill="#143B78" font-size="16" font-weight="650" text-anchor="start" letter-spacing="0">Files</text>
    <rect x="45" y="141" width="242" height="68" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="166.0" y="170" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Browser or agent</text><text x="166.0" y="194" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Use the UI or local API</text>
    <rect x="45" y="256" width="242" height="68" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="166.0" y="285" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Employer portal</text><text x="166.0" y="309" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">External application form</text>
    <rect x="45" y="332" width="242" height="68" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="166.0" y="361" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Gmail / Outlook</text><text x="166.0" y="385" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Read-only provider access</text>
    <rect x="420" y="141" width="273" height="92" rx="12" fill="#EBF3FF" stroke="#1F59AB" stroke-width="1.7"/><text x="556.5" y="170" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">JobOps UI + API</text><text x="556.5" y="194" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Next.js · :3210</text><text x="556.5" y="215" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Application and mail rules</text>
    <rect x="420" y="322" width="273" height="78" rx="12" fill="#EBF3FF" stroke="#1F59AB" stroke-width="1.7"/><text x="556.5" y="351" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Résumé scoring</text><text x="556.5" y="375" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">FastAPI · separate service</text>
    <path d="M835 157 V207 A110 14 0 0 0 1055 207 V157 A110 14 0 0 0 835 157 Z" fill="#EBF3FF" stroke="#1F59AB" stroke-width="1.7"/>
    <path d="M835 157 A110 14 0 0 0 1055 157" fill="none" stroke="#1F59AB" stroke-width="1.7"/>
    <text x="945" y="191" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">PostgreSQL</text>
    <text x="945" y="212" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Records and snapshots</text>
    <rect x="835" y="261" width="220" height="79" rx="4" fill="#E8F5EE" stroke="#24674E" stroke-width="1.7"/><text x="945.0" y="290" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Private storage</text><text x="945.0" y="314" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">PDF and DOCX bytes</text>
    <rect x="23" y="455" width="1074" height="166" rx="16" fill="#143B78" stroke="#143B78" stroke-width="1.5"/>
    <text x="45" y="488" fill="#FFFFFF" font-size="17" font-weight="750" text-anchor="start" letter-spacing="1.6">HIGHLIGHTED FLOW  /  JOB → INTERVIEW</text>
    <rect x="45" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="122" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Find opening</text>
    <text x="122" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Verify source + date</text>
    <path d="M197 552 H216 M210 546 L216 552 L210 558" fill="none" stroke="#BFD9FF" stroke-width="2.5"/>
    <rect x="220" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="297" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Save full JD</text>
    <text x="297" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Keep the exact text</text>
    <path d="M372 552 H391 M385 546 L391 552 L385 558" fill="none" stroke="#BFD9FF" stroke-width="2.5"/>
    <rect x="395" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="472" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Review résumé</text>
    <text x="472" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Choose the PDF</text>
    <path d="M547 552 H566 M560 546 L566 552 L560 558" fill="none" stroke="#BFD9FF" stroke-width="2.5"/>
    <rect x="570" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="647" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Submit + record</text>
    <text x="647" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Confirm externally</text>
    <path d="M722 552 H741 M735 546 L741 552 L735 558" fill="none" stroke="#BFD9FF" stroke-width="2.5"/>
    <rect x="745" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="822" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Match reply</text>
    <text x="822" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Link recruiting mail</text>
    <path d="M897 552 H916 M910 546 L916 552 L910 558" fill="none" stroke="#BFD9FF" stroke-width="2.5"/>
    <rect x="920" y="512" width="154" height="77" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="997" y="542" fill="#143B78" font-size="18" font-weight="740" text-anchor="middle" letter-spacing="0">Track interview</text>
    <text x="997" y="565" fill="#475B73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Log rounds + results</text>
  </g>
</svg>
