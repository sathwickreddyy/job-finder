<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 365" role="img" aria-labelledby="title description">
  <title id="title">Naukri maintenance and record export</title>
  <desc id="description">For Naukri, check the recorded date, update and verify the profile on Naukri, then record the verified date. Independently, use Settings to export records as JSON or CSV where supported.</desc>

  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1F59AB"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F59AB" stroke-width="1.7"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="1" y="1" width="1118" height="363" rx="22" fill="#F5F8FC" stroke="#CAD6E5" stroke-width="1.5"/>
    <text x="32" y="35" fill="#1F59AB" font-size="15" font-weight="750" text-anchor="start" letter-spacing="2">WALKTHROUGH / 08</text>
    <text x="32" y="70" fill="#142842" font-size="31" font-weight="750" text-anchor="start" letter-spacing="0">Verify maintenance and export records</text>
    <text x="32" y="99" fill="#475B73" font-size="19" font-weight="500" text-anchor="start" letter-spacing="0">Two independent actions you can show after the main application demo.</text>
    <text x="32" y="132" fill="#1F59AB" font-size="14" font-weight="750" text-anchor="start" letter-spacing="1.5">NAUKRI PROFILE</text>
    <path d="M272 181 H426" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <path d="M670 181 H823" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <rect x="32" y="147" width="240" height="75" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="152.0" y="176" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Home</text><text x="152.0" y="200" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Check the recorded date</text>
    <rect x="428" y="147" width="242" height="75" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="549.0" y="176" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Naukri</text><text x="549.0" y="200" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Update and verify the profile</text>
    <rect x="825" y="147" width="263" height="75" rx="12" fill="#EBF3FF" stroke="#1F59AB" stroke-width="1.7"/><text x="956.5" y="176" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Record verified update</text><text x="956.5" y="200" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Home reflects the new date</text>
    <text x="32" y="261" fill="#1F59AB" font-size="14" font-weight="750" text-anchor="start" letter-spacing="1.5">RECORD EXPORT</text>
    <path d="M272 310 H426" fill="none" stroke="#1F59AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#filled)"/>
    <rect x="32" y="276" width="240" height="68" rx="12" fill="#FFFFFF" stroke="#CAD6E5" stroke-width="1.7"/><text x="152.0" y="305" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Settings</text><text x="152.0" y="329" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Open Export</text>
    <rect x="428" y="276" width="242" height="68" rx="12" fill="#EBF3FF" stroke="#1F59AB" stroke-width="1.7"/><text x="549.0" y="305" fill="#142842" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Download records</text><text x="549.0" y="329" fill="#475B73" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Choose JSON or CSV</text>
  </g>
</svg>
