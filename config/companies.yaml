# Target companies. `ats_type` drives which source pulls them:
#   greenhouse  → needs `board_token`
#   ashby       → needs `org_slug`
#   lever       → needs `company_slug`
#   workday     → not yet supported (treated as manual)
#   manual      → paste jobs into config/manual_jobs.yaml
#   unknown     → skipped by source pipeline; still used for company_boost scoring
#
# Morgan Stanley is the current employer (see resumes/master.md) and is
# intentionally omitted — MS job postings should not be surfaced.

companies:
  # ─── AI-first companies (Ashby/Greenhouse, reliably fetchable) ──────
  - name: Anthropic
    ats_type: ashby
    org_slug: anthropic
    priority: P0
    preferred_locations: [Remote India, Remote]

